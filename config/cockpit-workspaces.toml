# Hermes CLI Cockpit workspace registry (iMac cmux -> MBP tmux)
#
# Five peer cockpit surfaces — never collapse Hermes and OpenClaw into one generic agent pane.

[topology]
local_visual_client = "iMac native cmux"
remote_runtime = "MBP tmux over SSH/Tailscale"
remote_alias = "mbp-runtime"
vault_path = "/Users/openclaw/.hermes/workspace"
repo_path = "/Users/danmagro/Code/hermes-cli-cockpit"
rule = "cmux is the local visual client; tmux is the remote persistence layer; launchd/systemd owns gateways"
boundary_rule = "Hermes and OpenClaw are peer AI assistant/runtime surfaces. Missing OpenClaw features show unsupported/not configured — do not remove the pane."

[[workspace]]
id = "hermes"
number = 1
title = "Hermes Tool / Hermes CLI Mission Control"
short_title = "Hermes Mission Control"
plane = "runtime-ops"
remote_tmux_session = "mission-hermes"
attach_command = "tmux attach -t mission-hermes"
mission_launcher = "mission-hermes"
primary_browser_target = "obsidian://open?vault=hermes"
secondary_browser_target = "http://127.0.0.1:4173/"
security = "Never print raw secrets. op whoami and vault metadata first; op read only in wrappers."

[[workspace]]
id = "openclaw"
number = 2
title = "OpenClaw Tool / OpenClaw CLI Mission Control"
short_title = "OpenClaw Mission Control"
plane = "runtime-ops"
remote_tmux_session = "mission-openclaw"
attach_command = "tmux attach -t mission-openclaw"
mission_launcher = "mission-openclaw"
primary_browser_target = "obsidian://open?vault=hermes&file=projects/hermes-cli-cockpit"
secondary_browser_target = "http://127.0.0.1:4174/"
normal_gateway_status = "openclaw gateway status"
normal_gateway_run = "openclaw gateway run"
normal_gateway_start = "openclaw gateway start"
lab_gateway_run = "openclaw --dev gateway run --port 19001 --bind loopback --auth none --allow-unconfigured --verbose --compact"
unsupported_posture = "Keep panes visible with unsupported/not configured when OpenClaw lacks a Hermes-equivalent feature."
security = "Separate OpenClaw credentials from Hermes; no shared-secret leakage."

[[workspace]]
id = "coding-workbench"
number = 3
title = "Coding Workbench"
short_title = "Coding Workbench"
plane = "coding"
remote_tmux_session = "cockpit-workbench"
attach_command = "tmux attach -t cockpit-workbench"
workbench_launcher = "tmux-workbench"
primary_browser_target = "http://localhost:3000/"
secondary_browser_target = "http://localhost:4175/"
notes = "Neovim, keystroke mentor rail, runway, git/diff/test, browser smoke. No merged Hermes/OpenClaw conversation."
boundary_rule = "Assistant chat lives in mission-hermes or mission-openclaw only."

[[workspace]]
id = "agent-deck"
number = 4
title = "Agent Deck"
short_title = "Agent Deck"
plane = "orchestration"
remote_tmux_session = "cockpit-workbench:agents"
attach_command = "tmux select-window -t cockpit-workbench:agents && tmux attach -d -t cockpit-workbench"
notes = "Worktrees, agent-deck, labeled slots, diff/test gates. Not Hermes/OpenClaw conversation."
agent_slots = ["Claude Code", "Codex", "OpenCode", "Goose", "Cursor CLI", "Hermes delegated coding", "OpenClaw delegated coding"]

[[workspace]]
id = "open-source-radar"
number = 5
title = "Open Source Radar / Community"
short_title = "OSS Radar"
plane = "community"
remote_tmux_session = "cockpit-community"
attach_command = "tmux attach -t cockpit-community"
community_launcher = "cockpit-community"
primary_browser_target = "https://github.com/NousResearch/hermes-agent"
secondary_browser_target = "GitHub discussions / Discord when configured"
posting_rule = "Draft-first only — no surprise GitHub or Discord posting."

[worktree_policy]
default_root = "/Users/openclaw/Code/worktrees"
branch_prefix = "agent/"
max_slots = 4
slot_labels = ["A", "B", "C", "D"]
worktree_name_template = "{repo}-{slug}"
rule_1 = "one agent, one branch, one worktree"
rule_2 = "agents do not commit to main"
rule_3 = "operator reviews diffs before merge"
rule_4 = "external GitHub/Discord posting is draft-first and requires explicit send/post"

[project_registry.seed]
id = "hermes"
github = "NousResearch/hermes-agent"
url = "https://github.com/NousResearch/hermes-agent"
notes = "Primary OSS radar seed project"
